experiment:
  name: prithvi_water_segmentation_test
  description: Prithvi-100M Foundation Model Experiment for water segmentation - QUICK TEST
  model_type: prithvi_eo_v1_100
  paper: https://arxiv.org/abs/2310.18660
data:
  base_path: /u/nathanj/national_ml/data/processed/patch_dataset
  huc_codes:
    - "03160113" # Only 1 HUC for quick testing
  modalities:
    - dem
    - optical
    - thermal
    - sar
  split_method: patch_level
  split_ratio: 0.9
  random_seed: 42
  optical_channels: 6
  total_channels: 9
  image_size: 224
  normalize_per_huc: true
model:
  decoder: FCNDecoder
  pretrained: true
  in_channels: 9
  num_classes: 1
  patch_size: 16
  embed_dim: 768
  depth: 12
  num_heads: 12
training:
  optimizer: AdamW
  learning_rate: 2.0e-05
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-08
  max_epochs: 50 # Reduced for testing
  batch_size: 8
  patience: 10 # Reduced for testing
  scheduler: CosineAnnealingLR
  T_max: 50 # Reduced for testing
  eta_min: 1.0e-06
  warmup_epochs: 5 # Reduced for testing
  gradient_clip_val: 1.0
  dropout: 0.1
  precision: 16-mixed
  monitor_metric: val_loss
  monitor_mode: min
loss:
  type: CombinedFocalDiceLoss
  focal_weight: 0.7
  dice_weight: 0.3
  focal_alpha: 0.75
  focal_gamma: 1.5
logging:
  experiment_tracking: wandb
  project_name: prithvi_water_segmentation_test
  wandb:
    entity: null
    tags:
      - prithvi
      - water_segmentation
      - 4modal
      - foundation_model
      - test
    group: prithvi_test
    notes: Prithvi-100M Foundation Model - QUICK TEST with 1 HUC
    log_model: false # Don't save models for testing
    watch_model: gradients
  save_top_k: 1 # Save fewer checkpoints
  save_last: true
  monitor: val_loss
  log_every_n_steps: 5 # More frequent logging for testing
  val_check_interval: 1.0
output:
  base_dir: outputs/prithvi_test_results
  model_dir: models
  figures_dir: figures
  logs_dir: logs
reproducibility:
  seed: 42
  deterministic: false
  benchmark: true

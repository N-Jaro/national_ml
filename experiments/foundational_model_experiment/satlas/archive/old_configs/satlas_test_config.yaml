experiment:
  name: satlas_water_segmentation_test
  description: SatLas Foundation Model Experiment for water segmentation - Single HUC Test
  model_type: satlas_swin_b_sentinel2_mi_ms
  paper: https://arxiv.org/abs/2211.15660

data:
  base_path: /u/nathanj/national_ml/data/processed/patch_dataset
  huc_codes: ["03030005", "03040206"] # Test with 2 available HUCs
  modalities:
    - dem
    - optical
    - thermal
    - sar
  split_method: patch_level
  train_ratio: 0.9 # Match Prithvi/Clay for fair comparison
  # random_seed not needed for SATLAS
  optical_channels: 6
  total_channels: 9
  image_size: 224
  normalize_per_huc: true

model:
  decoder: UperNetDecoder
  pretrained: true # Use pre-trained SATLAS checkpoint from TerraTorch
  in_channels: 9
  num_classes: 1
  # SatLas-specific parameters
  model_bands: ["B01", "B02", "B03", "B04", "B05", "B06", "B07", "B08", "B8A"] # Sentinel-2 bands

training:
  optimizer: AdamW
  learning_rate: 1.0e-04 # Higher learning rate for testing
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-08
  max_epochs: 2 # Short test run
  batch_size: 4 # Smaller batch size for testing
  patience: 20
  scheduler: CosineAnnealingLR
  T_max: 5
  eta_min: 1.0e-07
  warmup_epochs: 1
  gradient_clip_val: 1.0
  dropout: 0.1
  precision: 16-mixed
  monitor_metric: val_loss
  monitor_mode: min

loss:
  type: CombinedFocalDiceLoss
  focal_weight: 0.7
  dice_weight: 0.3
  focal_alpha: 0.75
  focal_gamma: 1.5

logging:
  experiment_tracking: wandb
  project_name: satlas_water_segmentation_test
  wandb:
    entity: null
    tags:
      - satlas
      - water_segmentation
      - 4modal
      - foundation_model
      - test
    group: satlas_test
    notes: SatLas Foundation Model Experiment - Single HUC Test
    log_model: false # Don't save models for test runs
    watch_model: gradients
  save_top_k: 1
  save_last: true
  monitor: val_loss
  log_every_n_steps: 5
  val_check_interval: 1.0

output:
  base_dir: outputs/satlas_test_results
  model_dir: models
  figures_dir: figures
  logs_dir: logs

reproducibility:
  seed: 42
  deterministic: false
  benchmark: true

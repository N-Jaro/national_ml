# SATLAS Pretrained Foundation Model Configuration
# Uses actual SATLAS pretrained weights via TerraTorch

experiment:
  name: "SATLAS_Pretrained_9Ch_Water_Segmentation"
  description: "SATLAS foundation model with pretrained weights for water segmentation using 9-channel input"
  version: "1.0"
  tags:
    ["satlas", "pretrained", "foundation_model", "water_segmentation", "9ch"]

# Data configuration - matches Prithvi/Clay exactly
data:
  dataset_name: "four_modal_dataset"
  base_path: "/u/nathanj/national_ml/data/processed/patch_dataset"
  huc_codes:
    - "03160113"
    - "19090102"
    - "17090011"

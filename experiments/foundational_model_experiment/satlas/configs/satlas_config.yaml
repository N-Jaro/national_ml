    - "13040209"
    - "17060109"
    - "16040204"
    - "08020301"
    - "10130306"
    - "18080003"
    - "07120005"
  modalities:
    - dem
    - optical
    - thermal
    - sar
  split_method: patch_level
  split_ratio: 0.9
  random_seed: 42
  optical_channels: 6
  total_channels: 9
  image_size: 224
  normalize_per_huc: true

model:
  decoder: UperNetDecoder
  pretrained: false # Train from scratch for 9-channel input
  in_channels: 9
  num_classes: 1
  # SatLas-specific parameters
  model_bands: ["B01", "B02", "B03", "B04", "B05", "B06", "B07", "B08", "B8A"] # Sentinel-2 bands

training:
  optimizer: AdamW
  learning_rate: 1.0e-05
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-08
  max_epochs: 500
  batch_size: 16
  patience: 20
  scheduler: CosineAnnealingLR
  T_max: 500
  eta_min: 1.0e-07
  warmup_epochs: 10
  gradient_clip_val: 1.0
  dropout: 0.1
  precision: 16-mixed
  monitor_metric: val_iou
  monitor_mode: max

loss:
  type: CombinedFocalDiceLoss
  focal_weight: 1.0
  dice_weight: 0.5
  focal_alpha: 0.25
  focal_gamma: 2.0

logging:
  experiment_tracking: wandb
  project_name: satlas_water_segmentation
  wandb:
    entity: null
    tags:
      - satlas
      - water_segmentation
      - 4modal
      - foundation_model
    group: satlas
    notes: SatLas Foundation Model Experiment for water segmentation
    log_model: true
    watch_model: gradients
  save_top_k: 3
  save_last: true
  monitor: val_iou
  log_every_n_steps: 10
  val_check_interval: 1.0

output:
  base_dir: outputs/satlas_results
  model_dir: models
  figures_dir: figures
  logs_dir: logs

reproducibility:
  seed: 42
  deterministic: false
  benchmark: true
